# Cloudflare Worker: the NDSU ARPC AI relay for the Coverage Explorer.
# Deployed by Cloudflare from GitHub (Workers Builds, root directory = this folder)
# or with `npx wrangler deploy` run here. Setup: README.md.
name = "arpc-explorer-ai-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true      # served at https://arpc-explorer-ai-relay.arpc-bd4.workers.dev
preview_urls = false    # no extra per-version addresses: the one above is the only way in

# The guards. Change here (or in the dashboard) and redeploy; no code change needed.
[vars]
RELAY_ON = "true"                                  # the kill switch: "false" stops all AI calls at once
ALLOWED_ORIGINS = "https://arpc-ndsu.github.io,https://arpc-coverage-explorer.ftsiboe.workers.dev"    # the public site and the private (Access-protected) copy; add "null" only while testing a local copy
MODEL = "claude-haiku-4-5"                         # the only model the relay uses
MAX_TOKENS = "1500"                                # cap on each answer
MAX_BODY = "262144"                                # cap on each request, bytes
PER_VISIT_CALLS = "40"                             # calls per page visit (best effort)
DAILY_USD = "5"                                    # spend limit per UTC day
MONTHLY_USD = "50"                                 # spend limit per UTC month
PRICE_IN = "1"                                     # US$ per million input tokens for MODEL
PRICE_OUT = "5"                                    # US$ per million output tokens for MODEL
COLLECT_ON = "true"                                # data collection (/collect): "false" stops storing records at once

# The spend counter. Create the namespace once (dashboard: Storage & Databases > KV,
# or `npx wrangler kv namespace create RELAY_KV`) and put its id here.
[[kv_namespaces]]
binding = "RELAY_KV"
id = "751af4b0c8a0414f8895e39fe848db7e"   # arpc-relay-spend, ARPC Cloudflare account (the KV namespace, not the D1 database)

# The secret is NOT here: set ANTHROPIC_API_KEY in the dashboard (Settings > Variables
# and Secrets, type Secret) or with `npx wrangler secret put ANTHROPIC_API_KEY`.

# Data collection: the explorer's records, stored in the D1 database
# "arpc-explorer-records" (ARPC account), bound as DB. The table is created on the
# first record. Without this binding /collect drops records quietly and the AI
# relay works as before. Reading records back needs the secret EXPORT_TOKEN
# (dashboard, type Secret, or `npx wrangler secret put EXPORT_TOKEN`); README.md.
[[d1_databases]]
binding = "DB"
database_name = "arpc-explorer-records"
database_id = "ad534d90-1fd3-47d2-88f7-50fd4579b281"
